# ============================================================
# Prometheus - Backend de métricas (PC Hub)
# Arquitectura: Recibe via Remote Write desde OTel Hub Collector
# + scraping local mínimo para Prometheus mismo
# Referencia: T-033 / DEC-0046 / validación humana interna no pública
# ============================================================

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  # Etiqueta global que identifica esta instancia
  external_labels:
    cluster: siot_research
    environment: research

# Archivos de reglas de alertas separados por dominio
rule_files:
  - "rules/edge_iot.yml"
  - "rules/openclaw.yml"
  - "rules/sistema_tesis.yml"

# Alertmanager: envía alertas a Telegram (vía webhook del bot)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "localhost:9093"

# ── Habilitar receptor de Remote Write (para OTel Hub Collector)
# Prometheus recibe métricas enviadas por push desde el OTel Collector
# Esto es clave para el modelo híbrido con intermitencia
remote_write_receiver: {}  # Habilitado con flag --web.enable-remote-write-receiver

scrape_configs:
  # ── Solo scraping local de Prometheus mismo (red estable: pull OK)
  - job_name: prometheus_local
    static_configs:
      - targets:
          - "127.0.0.1:9090"
        labels:
          dominio: sistema_tesis
          componente: prometheus

  # ── OTel Collector Hub (métricas del propio collector)
  - job_name: otel_collector_hub
    static_configs:
      - targets:
          - "127.0.0.1:8889"
        labels:
          dominio: sistema_tesis
          componente: otel_collector_hub

  # ── OTel Collector Hub expose (fallback directo sin Remote Write)
  - job_name: hub_aggregated_metrics
    static_configs:
      - targets:
          - "127.0.0.1:9102"
        labels:
          dominio: hub
          componente: otel_hub_expose

  # NOTA: Las métricas del Edge llegan vía Remote Write desde el OTel
  # Collector del Edge → OTel Hub → Remote Write → Prometheus.
  # NO se scraping directamente el Edge para no depender de
  # conectividad continua (diseño de resiliencia DEC-0046).
