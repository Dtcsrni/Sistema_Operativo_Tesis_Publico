# ============================================================
# Reglas de Alertas: sistema_tesis (infraestructura de investigación)
# Referencia: T-033 / DEC-0046 / validación humana interna no pública
# ============================================================

groups:
  - name: sistema_tesis.observability
    interval: 60s
    rules:
      # ── OTel Collector Hub sin métricas (el sistema de observabilidad está ciego)
      - alert: OTelCollectorHubDown
        expr: up{componente="otel_collector_hub"} == 0
        for: 2m
        labels:
          severity: critical
          dominio: sistema_tesis
        annotations:
          summary: "OTel Collector Hub caído"
          description: "El sistema de recolección de telemetría distribuida no está activo. Toda la observabilidad del Edge está suspendida."

      # ── Prometheus sin recibir Remote Write del Edge por mucho tiempo
      - alert: NoEdgeTelemetryReceived
        expr: |
          absent(siot_edge_system_cpu_time_seconds_total{dominio="edge_iot"})
        for: 15m
        labels:
          severity: warning
          dominio: sistema_tesis
        annotations:
          summary: "Sin telemetría del Edge por >15 minutos"
          description: "Prometheus no ha recibido métricas del dominio edge_iot. Puede indicar desconexión prolongada o fallo del OTel Collector Edge."

  - name: sistema_tesis.storage
    interval: 300s
    rules:
      - alert: HubDiskAlmostFull
        expr: |
          (
            siot_hub_system_filesystem_usage_bytes{state="used", mountpoint="/"}
            /
            siot_hub_system_filesystem_usage_bytes{state="reserved", mountpoint="/"}
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          dominio: sistema_tesis
        annotations:
          summary: "Disco del PC Hub al {{ $value | humanizePercentage }}"
          description: "El almacenamiento del nodo PC está casi lleno. Riesgo para datos de investigación y buffer OTel."

