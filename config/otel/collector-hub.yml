# ============================================================
# OpenTelemetry Collector - PC Hub (Nodo Central)
# Arquitectura: Receptor de telemetría del Edge + exportador a Prometheus
# Referencia: T-033 / DEC-0046 / validación humana interna no pública
#
# Rol: Recibe OTLP del Edge, enriquece con metadatos de sesión
# y exporta a Prometheus (backend de almacenamiento).
# ============================================================

extensions:
  health_check:
    endpoint: "0.0.0.0:13134"

  # Buffer persistente en el Hub también (para picos de ingestión)
  file_storage/hub_buffer:
    directory: /var/lib/otel/hub_buffer
    timeout: 10s

receivers:
  # ── Recibir telemetría de todos los nodos Edge vía OTLP
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

  # ── Scraping local de servicios del PC Hub (red estable: pull apropiado)
  prometheus/hub_local:
    config:
      scrape_configs:
        # Prometheus mismo
        - job_name: prometheus
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:9090"]
          metric_relabel_configs:
            - target_label: dominio
              replacement: sistema_tesis

        # Node exporter del PC Hub
        - job_name: hub_node_exporter
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:9100"]
          metric_relabel_configs:
            - target_label: dominio
              replacement: host_pc

        # OpenClaw Gateway
        - job_name: openclaw_gateway
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:4000"]
          metrics_path: /metrics
          metric_relabel_configs:
            - target_label: dominio
              replacement: openclaw

        # Telegram Bot
        - job_name: telegram_bot
          scrape_interval: 60s
          static_configs:
            - targets: ["localhost:9201"]
          metric_relabel_configs:
            - target_label: dominio
              replacement: openclaw

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  # Enriquecer con metadatos del hub
  resource/hub:
    attributes:
      - key: deployment.environment
        value: research
        action: insert

  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  # ── Exportar a Prometheus vía Remote Write (estándar CNCF)
  prometheusremotewrite:
    endpoint: "http://localhost:9090/api/v1/write"
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true  # Los atributos OTel se convierten en labels Prometheus
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s

  # ── También exponer directamente para Prometheus scraping (fallback)
  prometheus/hub_expose:
    endpoint: "0.0.0.0:9102"
    namespace: siot_hub
    resource_to_telemetry_conversion:
      enabled: true

  # ── Debug local
  logging:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 500

service:
  extensions: [health_check, file_storage/hub_buffer]
  pipelines:
    metrics:
      receivers:  [otlp, prometheus/hub_local]
      processors: [memory_limiter, resource/hub, batch]
      exporters:  [prometheusremotewrite, prometheus/hub_expose]
    logs:
      receivers:  [otlp]
      processors: [memory_limiter, resource/hub, batch]
      exporters:  [logging]

  telemetry:
    logs:
      level: warn
    metrics:
      level: basic
      address: "0.0.0.0:8889"
