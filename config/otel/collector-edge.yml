# ============================================================
# OpenTelemetry Collector - Nodo Edge (Orange Pi 5 Plus)
# Arquitectura: PUSH con buffer local persistente
# Referencia: T-033 / DEC-0046 / validación humana interna no pública
#
# Rol: Recolecta métricas/logs del Edge y los empuja al Hub.
# Si la red es intermitente, guarda en disco y reenvía al reconectar.
# ============================================================

extensions:
  # Buffer persistente en disco para sobrevivir desconexiones
  file_storage/edge_buffer:
    directory: /var/lib/otel/buffer
    timeout: 10s
    compaction:
      on_start: true
      directory: /var/lib/otel/buffer/compact

  # Healthcheck local (para Docker healthcheck sin depender del Hub)
  health_check:
    endpoint: "0.0.0.0:13133"

receivers:
  # ── Métricas del sistema host (CPU, RAM, disco, red, temperatura)
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
      filesystem:
      network:
      load:
      # Temperatura: requiere node_exporter o lm-sensors en el host
      # Se expone via prometheus receiver apuntando a node_exporter local

  # ── Métricas de contenedores Docker (desde los propios contenedores)
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

  # ── Métricas de node_exporter local (temperatura NPU, hardware ARM)
  prometheus/local_node:
    config:
      scrape_configs:
        - job_name: edge_node_exporter
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:9100"]
          metric_relabel_configs:
            - target_label: dominio
              replacement: edge_iot

  # ── Ingesta desde MQTT (sensores BLE → sensores IoT → broker local)
  # Convierte mensajes MQTT con payload JSON a métricas OTel
  # Formato esperado: {"sensor_id": "s1", "temperatura": 24.5, "humedad": 60}
  mqtt:
    broker: "tcp://localhost:1883"
    client_id: "otel-collector-edge"
    topics:
      - topic: "siot/sensors/#"
        qos: 1
    timeout: 5s

processors:
  # ── Limitar consumo de memoria en el Orange Pi
  memory_limiter:
    check_interval: 5s
    limit_mib: 128
    spike_limit_mib: 32

  # ── Agregar atributos de identidad del nodo (DEC-0046)
  resource:
    attributes:
      - key: dominio
        value: edge_iot
        action: insert
      - key: node.id
        value: orange_pi_5_plus
        action: insert
      - key: node.type
        value: siot-edge
        action: insert
      - key: deployment.environment
        value: research
        action: insert

  # ── Agrupar en lotes para eficiencia de red
  batch:
    timeout: 10s
    send_batch_size: 512

  # ── Filtrar métricas de alta cardinalidad irrelevantes
  filter/reduce_noise:
    metrics:
      exclude:
        match_type: regexp
        metric_names:
          - "go_gc_.*"
          - "process_open_fds"

exporters:
  # ── EXPORTADOR PRINCIPAL: enviar al Hub vía OTLP con retry y buffer
  otlp/hub:
    endpoint: "${SIOT_HUB_OTEL_ENDPOINT:-http://pc-hub:4317}"
    tls:
      insecure: true  # Cambiar a false con certificados en producción
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 300s   # Backoff hasta 5 min entre reintentos
      max_elapsed_time: 0  # Sin límite: reintentar indefinidamente
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
      storage: file_storage/edge_buffer  # Persistir en disco si cae la red

  # ── EXPORTADOR LOCAL: exponer métricas para debug sin necesitar Hub
  prometheus/local_debug:
    endpoint: "0.0.0.0:9101"
    namespace: siot_edge
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [file_storage/edge_buffer, health_check]
  pipelines:
    metrics:
      receivers:  [hostmetrics, otlp, prometheus/local_node, mqtt]
      processors: [memory_limiter, resource, filter/reduce_noise, batch]
      exporters:  [otlp/hub, prometheus/local_debug]
    logs:
      receivers:  [otlp]
      processors: [memory_limiter, resource, batch]
      exporters:  [otlp/hub]

  telemetry:
    logs:
      level: warn
    metrics:
      level: basic
      address: "0.0.0.0:8888"
