# ==============================================================================
# heltec_wsl_v3_pins.yaml - Especificación de Hardware del Nodo Sensor de Tesis
# ==============================================================================
# Define la correspondencia física de los componentes, sus buses, pines y
# el estado de validación para asegurar la integridad de la compilación de firmware.
# ==============================================================================

placa:
  modelo: "Heltec Wireless Stick Lite V3"
  soc: "ESP32-S3FN8"
  frecuencia_mhz: 240
  enlace_radio: "SX1262 LoRa"

estado_diseno:
  esquematico_kicad: "VERIFICADO"       # Estado de eda_kicad
  pcb_fabricada: "EN_PROTOTIPO"         # Placa física soldada
  firmware_compilado: "PENDIENTE"        # PlatformIO compila exitosamente
  prueba_campo: "PENDIENTE"             # PDR verificado en Pachuca

pines_fisicos:
  # Interfaz del Transceptor LoRa (SX1262 interno en la placa Heltec)
  lora_spi:
    sck: 9
    miso: 11
    mosi: 10
    nss: 8                              # Chip Select / NSS
    rst: 12                             # Reset del transceptor
    busy: 13                            # Pin de estado ocupado
    dio1: 14                            # Interrupción DIO1 de recepción

  # Bus I2C para Sensores (Telemetría de Temperatura/Humedad y Batería)
  sensores_i2c:
    sda: 41
    scl: 42
    modelo_sensor: "SHT31"
    frecuencia_hz: 100000

  # Puerto UART para el Módulo GPS (Geolocalización de activos móviles)
  gps_uart:
    rx: 43                              # ESP32 RX (Conectado al TX del GPS)
    tx: 44                              # ESP32 TX (Conectado al RX del GPS)
    baudrate: 9600
    modelo_gps: "U-blox NEO-6M"

  # Entradas y Salidas Auxiliares
  auxiliares:
    led_estado: 35                      # LED integrado azul para inferencia/estado
    adc_bateria: 1                      # Canal ADC para monitorear voltaje LiPo
    boton_reset: 0                      # Botón físico del usuario en la placa
