<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">Flujo SIOT de telemetría híbrida</title><desc id="desc">Nodo sensor, enlace LoRa punto a punto, gateway Edge y servicios de análisis.</desc>
<rect width="1000" height="330" rx="28" fill="#071a22"/><g font-family="Arial,sans-serif" fill="#e7fbff"><text x="56" y="58" font-size="26" font-weight="700">Arquitectura de referencia SIOT</text><text x="56" y="88" font-size="16" fill="#9fc3cc">Flujo conceptual; las configuraciones se validan por campaña experimental.</text></g>
<g stroke="#38d9c0" stroke-width="4" fill="none"><path d="M270 190H390"/><path d="M610 190H730"/><path d="M370 182l20 8-20 8M710 182l20 8-20 8"/></g>
<g font-family="Arial,sans-serif"><g><rect x="55" y="130" width="215" height="120" rx="16" fill="#123645" stroke="#4ee0c4"/><text x="82" y="174" fill="#e7fbff" font-size="22" font-weight="700">Nodo sensor</text><text x="82" y="205" fill="#a9cbd3" font-size="16">Medición y trama</text><text x="82" y="229" fill="#a9cbd3" font-size="16">de telemetría</text></g><g><rect x="390" y="130" width="220" height="120" rx="16" fill="#123645" stroke="#4ee0c4"/><text x="420" y="174" fill="#e7fbff" font-size="22" font-weight="700">Enlace LoRa</text><text x="420" y="205" fill="#a9cbd3" font-size="16">P2P, parámetros</text><text x="420" y="229" fill="#a9cbd3" font-size="16">registrados</text></g><g><rect x="730" y="130" width="215" height="120" rx="16" fill="#123645" stroke="#4ee0c4"/><text x="757" y="174" fill="#e7fbff" font-size="22" font-weight="700">Gateway Edge</text><text x="757" y="205" fill="#a9cbd3" font-size="16">Reenvío MQTT y</text><text x="757" y="229" fill="#a9cbd3" font-size="16">procesamiento local</text></g></g></svg>