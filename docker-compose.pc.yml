services:
  # Base Vectorial y Semántica
  db-vectorial-weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.31.4
    container_name: db-vectorial-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: "text2vec-openai,generative-openai"
      CLUSTER_HOSTNAME: "db-vectorial-weaviate"
      RAFT_BOOTSTRAP_EXPECT: "1"
      DISABLE_TELEMETRY: "true"
    volumes:
      - toltecayotl_weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/.well_known/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - siot-network

  # Motor de Inferencia llama.cpp
  inferencia-llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: inferencia-llamacpp
    restart: unless-stopped
    ports:
      - "8085:8080"
    command: -m /models_import/model.gguf -c 4096 --host 0.0.0.0 --port 8080
    volumes:
      - ./runtime/models:/models_import:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - siot-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]



  # Hub de Misiones (Dashboard Web Interactivo)
  hub-misiones-web:
    image: siot-hub-misiones:latest
    container_name: hub-misiones-web
    ports:
      - "4000:4000"
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/app/data/mission-control.db
      - NEXT_PUBLIC_PET_API_BASE_URL=http://localhost:8001
      - PET_API_INTERNAL_URL=http://api-persistencia-pet:8001
      - OPENCLAW_GATEWAY_URL=ws://gateway-orchestrator-api:18789
    networks:
      - siot-network
    depends_on:
      api-persistencia-pet:
        condition: service_started

  # Visor Estático de Canon/Docs
  visor-canon-docs:
    image: tablero-gobernanza:latest
    container_name: visor-canon-docs
    ports:
      - "8081:80"
    restart: unless-stopped
    env_file:
      - ${SIOT_DOCS_ENV_FILE:-config/env/tesis-os.env.example}
    volumes:
      - canon_data:/app/00_sistema_tesis:ro
    networks:
      - siot-network

  # Orquestador Gateway (API)
  gateway-orchestrator-api:
    image: siot-agente-core:latest
    container_name: gateway-orchestrator-api
    command:
      - python
      - runtime/openclaw/bin/openclaw_cli.py
      - pasarela
      - servir
      - --host
      - 0.0.0.0
      - --port
      - "18789"
    ports:
      - "18789:18789"
    restart: unless-stopped
    env_file:
      - .env
      - ${SIOT_AGENT_ENV_FILE:-config/env/openclaw.env}
    volumes:
      - ./00_sistema_tesis:/app/00_sistema_tesis
      - ./runtime/openclaw/state:/app/runtime/openclaw/state
      - ./07_scripts:/app/07_scripts:ro
    networks:
      - siot-network
    depends_on:
      - visor-canon-docs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # API de Persistencia PET
  api-persistencia-pet:
    image: siot-agente-core:latest
    container_name: api-persistencia-pet
    command:
      - python
      - 07_scripts/ops/pet_daemon.py
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./00_sistema_tesis:/app/00_sistema_tesis
    networks:
      - siot-network
    depends_on:
      - db-vectorial-weaviate

  # Bot Telegram / Agente Core
  bot-agente-telegram:
    image: siot-agente-core:latest
    container_name: bot-agente-telegram
    restart: unless-stopped
    command:
      - python
      - -m
      - runtime.openclaw.openclaw_local.telegram_bot
    env_file:
      - .env
      - ${SIOT_AGENT_ENV_FILE:-config/env/openclaw.env}
    environment:
      - SISTEMA_TESIS_RUNTIME=docker-agent
      - PYTHONUNBUFFERED=1
      - OPENCODE_BASE_URL=http://inferencia-llamacpp:8080/v1
      - OPENCLAW_SERENA_URL=http://host.docker.internal:8765/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./00_sistema_tesis:/app/00_sistema_tesis
      - ./runtime/openclaw/state:/app/runtime/openclaw/state
      - ./07_scripts/ops:/app/07_scripts/ops:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import importlib,os,sys; importlib.import_module('runtime.openclaw.openclaw_local.telegram_bot'); sys.exit(0 if os.getenv('OPENCLAW_TELEGRAM_BOT_TOKEN') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - siot-network
    depends_on:
      - gateway-orchestrator-api
      - db-vectorial-weaviate

  # Monitor de Telemetría
  monitor-telemetria:
    image: siot-agente-core:latest
    container_name: monitor-telemetria
    restart: unless-stopped
    command:
      - python
      - 07_scripts/ops/monitor_daemon.py
    volumes:
      - ./runtime/openclaw/state:/app/runtime/openclaw/state:ro
      - ./07_scripts:/app/07_scripts:ro
    networks:
      - siot-network

  # Executor Subordinado / RAG
  executor-codigo-rag:
    image: siot-executor-opencode:latest
    container_name: executor-codigo-rag
    ports:
      - "4096:4096"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 2G
    env_file:
      - .env
      - ${SIOT_AGENT_ENV_FILE:-config/env/openclaw.env}
    environment:
      - SISTEMA_TESIS_RUNTIME=docker-executor
      - OPENCLAW_REPO_ROOT=/app
      - OPENCODE_MODEL=deepseek-r1:7b
      - OPENCODE_PROVIDER=openai
      - OPENCODE_BASE_URL=http://inferencia-llamacpp:8080/v1
      - OPENCODE_SERVER_URL=http://executor-codigo-rag:4096
      - OPENCODE_TIMEOUT_SEC=180
      - RAG_ENDPOINT=http://db-vectorial-weaviate:8080
      - RAG_REQUIRED=true
      - PYTHONUNBUFFERED=1
    volumes:
      - ./00_sistema_tesis:/app/00_sistema_tesis:ro
      - ./runtime/opencode:/app/runtime/opencode
      - ./runtime/workspaces:/app/runtime/workspaces
      - ./07_scripts:/app/07_scripts:ro
      - ./opencode.json:/app/opencode.json:ro
    networks:
      - siot-network
    depends_on:
      - inferencia-llamacpp
      - db-vectorial-weaviate

networks:
  siot-network:
    name: siot-network
    driver: bridge

volumes:
  toltecayotl_weaviate_data:
    driver: local
  canon_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/00_sistema_tesis
