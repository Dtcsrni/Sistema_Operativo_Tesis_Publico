name: Integración Continua (Toltecayotl)

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  probar-y-construir:
    runs-on: ubuntu-latest
    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Obtener código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "requirements-dev.txt"

      - name: Instalar dependencias de prueba
        run: uv pip install --system -r requirements-dev.txt

      - name: Instalar shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validar servicios basados en Dockerfile.agent
        run: pwsh -File 07_scripts/check_docker_agent_services.ps1

      - name: Crear .env dummy para validación de compose
        run: touch .env

      - name: Validar sintaxis de variantes compose críticas
        run: |
          docker compose -f docker-compose.yml -f docker-compose.pc.yml config >/dev/null
          docker compose -f docker-compose.pc.yml config >/dev/null
          docker compose -f docker-compose.pc.clean.yml config >/dev/null
          docker compose -f docker-compose-openclaw.yml config >/dev/null

      - name: Ejecutar shellcheck sobre scripts shell
        run: |
          rg --files bootstrap ops runtime/openclaw tests/smoke tests/integration benchmarks/scripts -g "*.sh" | xargs -r shellcheck

      - name: Escaneo de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ejecutar compuerta de gobernanza (Testing & Build total)
        if: github.repository != 'Dtcsrni/Sistema_Operativo_Tesis_Publico'
        env:
          SISTEMA_TESIS_SKIP_GPG_CHECK: "1"
          PYTHONPATH: .:$GITHUB_WORKSPACE/07_scripts
          OPENCLAW_BYPASS_SAFE_MODE: "1"
          TELEGRAM_MODE: "TELEMETRY_ONLY"
        # Se elimina SISTEMA_TESIS_STEP_ID hardcodeado para forzar autodetección
        run: python 07_scripts/governance_gate.py --stage ci --agent github-actions

      - name: Confirmar cambios de wiki si pasan las compuertas
        if: github.repository != 'Dtcsrni/Sistema_Operativo_Tesis_Publico' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 06_dashboard/wiki 06_dashboard/generado 06_dashboard/publico
          if git diff --cached --quiet; then
            echo "No hay cambios de wiki para confirmar."
          else
            git commit -m "chore(ci): regeneración automática de proyecciones y artefactos [CI-AUTO]"
            git push origin HEAD:${GITHUB_REF#refs/heads/} || true
          fi

      - name: Subir atestación de gobernanza y documentos generados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artefactos-compuerta-gobernanza
          path: |
            historial interno no público/governance_gate
            README.md
            06_dashboard/wiki
            06_dashboard/generado
          if-no-files-found: ignore
