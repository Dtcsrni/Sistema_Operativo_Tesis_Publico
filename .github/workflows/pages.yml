name: desplegar-sitio-publico

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  preparar-artefacto-publico:
    if: github.repository == 'Dtcsrni/Sistema_Operativo_Tesis_Publico' && github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar artefacto público de entrada
        run: |
          test -f index.html
          test -f manifest_publico.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto estático de la superficie pública
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: preparar-artefacto-publico
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar sitio público
        id: deployment
        uses: actions/deploy-pages@v4
