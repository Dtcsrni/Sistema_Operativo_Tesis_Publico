services:
  # Gateway IoT del edge: sensores, actuadores y telemetría local
  siot-edge-gw:
    build:
      context: .
      dockerfile: Dockerfile.edge.base
    image: siot-edge-gw:latest # Se debe buildear en el edge o vía buildx
    container_name: siot-edge-gw
    init: true
    restart: unless-stopped
    privileged: ${SIOT_EDGE_PRIVILEGED:-false}
    env_file:
      - ${SIOT_EDGE_ENV_FILE:-config/env/domains/edge.env.example}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_RAWIO
      - NET_ADMIN
    tmpfs:
      - /tmp
    volumes:
      - /dev:/dev # Acceso a dispositivos de hardware
      - ./00_sistema_tesis/canon:/app/canon:ro
      - ./runtime/edge_iot/logs:/app/logs
    environment:
      - NODE_ID=orange_pi_5_plus
      - HUB_URL=${SIOT_HUB_URL:-http://pc-hub:4000}
    networks:
      - siot-iot-net
      - siot-inference-net
    healthcheck:
      test: ["CMD", "python3", "07_scripts/verify_edge_health.py"]
      interval: 60s
      timeout: 10s
      retries: 3
    command: ["python3", "runtime/edge_iot/main.py"]

  # Inferencia local RKLLM en el edge
  siot-llm-edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
    image: siot-llm-edge:latest
    container_name: siot-llm-edge
    profiles:
      - npu
    init: true
    restart: unless-stopped
    privileged: true # Requerido para /dev/rknpu y mmap
    env_file:
      - ${SIOT_EDGE_ENV_FILE:-config/env/domains/edge.env.example}
    environment:
      - MODEL_PATH=/models/tinyllama_rkllm.rkllm
    volumes:
      - /dev:/dev
      - ./runtime/models/edge:/models:ro
    networks:
      - siot-inference-net
    command: ["python3", "01_servicios/edge/siot-llm-edge/main.py"]

  # Sincronizador hacia el hub del PC
  siot-edge-sync:
    build:
      context: .
      dockerfile: Dockerfile.edge
    image: siot-edge-sync:latest
    container_name: siot-edge-sync
    init: true
    restart: unless-stopped
    env_file:
      - ${SIOT_EDGE_ENV_FILE:-config/env/domains/edge.env.example}
    environment:
      - HUB_URL=${SIOT_HUB_URL:-http://pc-hub:4000}
      - SYNC_INTERVAL=300
    volumes:
      - ./00_sistema_tesis/canon:/app/canon
      - ./runtime/edge_sync/buffer:/app/buffer
    networks:
      - siot-iot-net
    depends_on:
      siot-edge-gw:
        condition: service_healthy
    command: ["python3", "runtime/edge_sync/sync_manager.py"]

  # ── OpenTelemetry Collector Edge (T-033 / DEC-0046)
  # Push de métricas al Hub con buffer local para intermitencia
  otel-collector-edge:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector-edge
    profiles:
      - metrics
    restart: unless-stopped
    command: ["--config=/etc/otel/collector-edge.yml"]
    environment:
      - SIOT_HUB_OTEL_ENDPOINT=${SIOT_HUB_URL:-http://pc-hub:4317}
    volumes:
      - ./config/otel/collector-edge.yml:/etc/otel/collector-edge.yml:ro
      - /var/lib/otel/buffer:/var/lib/otel/buffer  # Buffer persistente
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "4317:4317"   # OTLP gRPC (contenedores → collector)
      - "4318:4318"   # OTLP HTTP
      - "9101:9101"   # Debug métricas local (sin Hub)
      - "13133:13133" # Health check
    networks:
      - siot-iot-net
      - siot-inference-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:13133/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Node Exporter (T-033): métricas hardware Orange Pi
  # CPU, RAM, temperatura, disco — consumido por OTel Collector local
  node-exporter-edge:
    image: prom/node-exporter:latest
    container_name: node-exporter-edge
    profiles:
      - metrics
    restart: unless-stopped
    pid: host
    network_mode: host  # Necesario para métricas de red del host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.thermal_zone"  # Temperatura NPU/SoC
      - "--web.listen-address=:9100"

networks:
  siot-iot-net:
    driver: bridge
    internal: true # Sin acceso a internet por default
  siot-inference-net:
    driver: bridge
    internal: true # Aislado de IoT y Sync excepto vía gateways controlados
