[pytest]
addopts = --basetemp=tests/tmp --ignore=tests/test_openclaw_cli.py --ignore=tests/test_openclaw_hermes_decoupled.py --ignore=tests/test_openclaw_runtime.py --ignore=tests/test_openclaw_telegram_bot.py --ignore=07_scripts/tests/test_openclaw_chatgpt_plus.py
norecursedirs = tests/tmp .venv node_modules runtime 04_implementacion 03_datos scratch sirena_555_flipflop .git .next dist build brain
testpaths = tests 07_scripts/tests 07_scripts/ai_tools
tmp_path_retention_policy = none
tmp_path_retention_count = 1
markers =
    slow: mark test as slow
    integration: mark test as integration test
    infra: mark test as infrastructure test
    docker: mark test as requiring docker stack
