<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Operativo de Tesis de Posgrado</title>
    <!-- Meta redirección instantánea -->
    <meta http-equiv="refresh" content="0; url=06_dashboard/publico/index.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --accent-color: #3b82f6;
            --text-color: #f3f4f6;
            --muted-color: #9ca3af;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 2.5rem;
            border-radius: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(59, 130, 246, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            margin: 0 auto 1.5rem;
            animation: spin 1s ease-in-out infinite;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 0.5rem;
            letter-spacing: -0.025em;
        }
        p {
            font-size: 0.95rem;
            color: var(--muted-color);
            margin: 0 0 1.5rem;
            font-weight: 300;
        }
        .btn-fallback {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--accent-color);
            border: none;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.2), 0 2px 4px -1px rgba(59, 130, 246, 0.1);
        }
        .btn-fallback:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
            filter: brightness(1.1);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script>
        // Redirección por JavaScript como respaldo inmediato
        window.location.replace("06_dashboard/publico/index.html");
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Tablero de Tesis</h1>
        <p>Redireccionando al centro de control público...</p>
        <a href="https://github.com/Dtcsrni/Sistema_Operativo_Tesis_Publico/blob/main/06_dashboard/publico/index.html" class="btn-fallback">Entrar al Tablero</a>
    </div>
</body>
</html>
<footer class="public-update"><p>Última actualización: <strong>2026-06-01</strong></p></footer>
